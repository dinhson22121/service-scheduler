x-app: &app
  build: .
  image: service-scheduler:local
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DB_URL: jdbc:postgresql://postgres:5432/scheduler
    DB_USER: scheduler
    DB_PASSWORD: ${DB_PASSWORD:-scheduler}
    LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081 && printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"UP\" <&3'"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 20s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scheduler}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 30

  app1:
    <<: *app
    ports:
      - "8081:8081"

  app2:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
      app1:
        condition: service_healthy
    ports:
      - "8082:8081"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
