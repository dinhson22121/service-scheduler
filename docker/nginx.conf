events {}

http {
    # One nginx is the single entry point, so these counters are shared by every replica behind it.
    limit_req_zone $binary_remote_addr zone=per_client:10m rate=100r/s;
    limit_req_status 429;

    upstream scheduler {
        server app1:8080 max_fails=3 fail_timeout=5s;
        server app2:8080 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 80;

        error_page 429 = @too_many_requests;

        location /api/ {
            limit_req zone=per_client burst=100 nodelay;
            proxy_pass http://scheduler;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout;
        }

        location /v3/api-docs {
            proxy_pass http://scheduler;
        }

        location /swagger-ui {
            proxy_pass http://scheduler;
        }

        location @too_many_requests {
            default_type application/problem+json;
            add_header Retry-After 1 always;
            return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"The limit is 100 requests per second per client; retry after 1 second"}';
        }

        location / {
            return 404;
        }
    }
}
