
x-app-loadtest: &app-loadtest
  cpus: 2
  mem_limit: 1536m
  environment:
    SEED_LOCATIONS: file:/loadtest/seed/loadtest_seed.sql
    DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  volumes:
    - ./loadtest/seed:/loadtest/seed:ro

services:
  postgres:
    cpus: 2
    mem_limit: 2g
    shm_size: 512m
    command: >-
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c max_connections=100
      -c shared_preload_libraries=pg_stat_statements

  app1: *app-loadtest
  app2: *app-loadtest

  nginx:
    cpus: 0.5
    mem_limit: 128m
    depends_on: !override
      app1:
        condition: service_healthy
    volumes:
      - ${NGINX_CONF:-./loadtest/nginx/two-replicas.conf}:/etc/nginx/nginx.conf:ro

  k6:
    image: grafana/k6:1.3.0
    profiles: [loadtest]
    cpus: 1
    mem_limit: 1g
    depends_on:
      nginx:
        condition: service_started
    environment:
      BASE_URL: http://nginx
      ACTUATORS: ${ACTUATORS:-http://app1:8081,http://app2:8081}
      RUN_LABEL: ${RUN_LABEL:-run}
    volumes:
      - ./loadtest/scripts:/scripts:ro
      - ./loadtest/results:/results
